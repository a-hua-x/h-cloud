name: h-cloud Pilot Verification
on:
  push:
    paths:
      - demo/**
      - .github/workflows/project-flow-cloud.yml
      - .github/workflows/project-flow-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Check Pages enablement
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.get(context.repo);
            core.setOutput('mode', data.has_pages ? 'publish' : 'build');
            if (!data.has_pages) {
              await core.summary.addHeading('Build-only verification').addRaw('Pages is not enabled. Enable GitHub Actions under Settings → Pages to publish the static preview.').write();
            }
  verify:
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/project-flow-cloud.yml
    with:
      request_id: pilot-${{ github.run_id }}
      source_sha: ${{ github.sha }}
      mode: ${{ needs.check.outputs.mode }}
      directory: demo
      manager: static
      node: '22'
      output: site
